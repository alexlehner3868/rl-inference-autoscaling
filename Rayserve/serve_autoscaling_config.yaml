applications:
  - name: camera-app
    import_path: Rayserve.serve_yolo:app
    route_prefix: /
    external_scaler_enabled: false
    deployments:
      - name: YOLOWorker
        num_replicas: auto
        max_ongoing_requests: 1
        max_queued_requests: 50
        autoscaling_config:
          min_replicas: 1
          initial_replicas: 1
          max_replicas: 10
          target_ongoing_requests: 1
          upscale_delay_s: 0
          downscale_delay_s: 20
          metrics_interval_s: 1
          look_back_period_s: 5
